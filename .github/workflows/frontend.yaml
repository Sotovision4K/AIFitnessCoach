name: Deploy frontend

on:
    push:
        branches:
            - main
        paths:
            - "frontend/**"
            - ".github/workflows/frontend.yaml"
    workflow_dispatch:

env:
    AWS_REGION: us-east-1

concurrency:
    group: deploy-frontend-${{ github.ref }}
    cancel-in-progress: false

permissions:
    contents: read
    id-token: write
    security-events: write
    pull-requests: read

jobs:
    sast:
        name: SAST gate
        uses: ./.github/workflows/sast.yaml
        secrets: inherit

    deploy-frontend:
        needs: sast
        name: Build & deploy frontend
        runs-on: ubuntu-latest
        environment: dev
        defaults:
            run:
                working-directory: frontend/ai_coach
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/ai_coach/package-lock.json

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

            # ---- Deploy step — uncomment the block matching your target ----
            #
            # Option A: S3 + CloudFront
            # - name: Configure AWS credentials
            #   uses: aws-actions/configure-aws-credentials@v4
            #   with:
            #       aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
            #       aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
            #       aws-region: ${{ env.AWS_REGION }}
            # - name: Sync to S3
            #   run: aws s3 sync dist/ s3://${{ secrets.FRONTEND_BUCKET }} --delete
            # - name: Invalidate CloudFront
            #   run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DIST_ID }} --paths "/*"

            - name: Upload build artifact
              uses: actions/upload-artifact@v4
              with:
                  name: frontend-dist-${{ github.sha }}
                  path: frontend/ai_coach/dist
                  retention-days: 7
