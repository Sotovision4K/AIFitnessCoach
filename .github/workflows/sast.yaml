name: SAST

on:
    pull_request:
        branches:
            - main
    schedule:
        # Weekly, Mondays at 09:00 UTC
        - cron: "0 9 * * 1"
    workflow_dispatch:

permissions:
    contents: read
    security-events: write # for SARIF uploads to the Security tab
    pull-requests: read

concurrency:
    group: sast-${{ github.ref }}
    cancel-in-progress: true

jobs:
    # ---------------------------------------------------------------------
    # Secrets — runs first; cheap and catches the most damaging mistakes.
    # ---------------------------------------------------------------------
    gitleaks:
        name: Secrets scan (Gitleaks)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0 # full history so Gitleaks can scan commits
            - name: Run Gitleaks
              uses: gitleaks/gitleaks-action@v2
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  # Fails the job on any leak found.

    # ---------------------------------------------------------------------
    # Python code — Bandit (AST rules) + Semgrep (broader rule packs).
    # ---------------------------------------------------------------------
    python-sast:
        name: Python SAST (Bandit + Semgrep)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Install scanners
              run: pip install --upgrade bandit semgrep

            - name: Bandit (HIGH severity only)
              # -ll = report MEDIUM+ severity, -lll = HIGH only.
              # Exits non-zero when issues are found.
              run: bandit -r app -lll -iii

            - name: Semgrep (security audit + python)
              run: |
                  semgrep scan \
                    --config p/security-audit \
                    --config p/python \
                    --error \
                    --severity ERROR \
                    app

    # ---------------------------------------------------------------------
    # Python dependencies — known CVEs in requirements.txt.
    # ---------------------------------------------------------------------
    python-deps:
        name: Python deps (pip-audit)
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install pip-audit
              run: pip install --upgrade pip-audit
            - name: Audit requirements.txt
              # Fails on any known vuln. Add --ignore-vuln GHSA-xxxx to suppress.
              run: pip-audit -r requirements.txt --strict

    # ---------------------------------------------------------------------
    # Frontend code — Semgrep JS/TS + React rule packs.
    # ---------------------------------------------------------------------
    frontend-sast:
        name: Frontend SAST (Semgrep)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend/ai_coach
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-python@v5
              with:
                  python-version: "3.12"
            - name: Install Semgrep
              run: pip install --upgrade semgrep
            - name: Semgrep (JS/TS + React)
              run: |
                  semgrep scan \
                    --config p/javascript \
                    --config p/typescript \
                    --config p/react \
                    --config p/owasp-top-ten \
                    --error \
                    --severity ERROR \
                    src

    # ---------------------------------------------------------------------
    # Frontend dependencies — npm audit on the lockfile.
    # ---------------------------------------------------------------------
    frontend-deps:
        name: Frontend deps (npm audit)
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend/ai_coach
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: frontend/ai_coach/package-lock.json
            - name: Install (no scripts) for accurate lockfile resolution
              run: npm ci --ignore-scripts
            - name: npm audit (fail on high/critical)
              run: npm audit --audit-level=high
