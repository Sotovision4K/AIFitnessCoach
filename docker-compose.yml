version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-coach-llm-api
    ports:
      - "8080:8080"
      - "5678:5678"
    env_file:
      - .env
    volumes:
      - ./app:/app/app
    command: ["python", "-m", "debugpy", "--listen", "0.0.0.0:5678", "-m", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080", "--reload"]
